name: Deploy CIMS to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cloud-incident-monitoring-system
            git pull origin develop
            docker build -t cims-frontend ./frontend
            docker build -t cims-backend ./backend
            docker-compose down
            docker-compose up -d
            docker ps